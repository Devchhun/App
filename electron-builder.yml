appId: com.creativeaieditor.app
productName: Creative AI Editor
publish:
  provider: github
  owner: Devchhun
  repo: App
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
extraResources:
  - from: python-worker
    to: python-worker
    filter:
      - '**/*'
  - from: resources/python-runtime
    to: python-runtime
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # No spaces (${productName} is "Creative AI Editor") -- electron-builder's
  # own generated latest.yml sanitizes spaces in the artifact filename to
  # hyphens, but GitHub's release-asset upload sanitizes them to PERIODS
  # instead, so the two disagreed on the actual filename. auto-updater then
  # fetches a correct latest.yml pointing at a URL that 404s on GitHub -- it
  # detects an update is available but can never download it. Hyphenating
  # this outright means there are no spaces for either side to sanitize
  # differently in the first place.
  artifactName: Creative-AI-Editor-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
npmRebuild: false
